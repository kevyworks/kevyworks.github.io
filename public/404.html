<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Kevyworks</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
        background:#09090b;color:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,sans-serif;text-align:center;padding:24px}
      .code{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#818cf8}
      h1{font-size:clamp(32px,6vw,56px);margin:12px 0 8px;letter-spacing:-.02em}
      p{color:#a1a1aa;max-width:420px;margin:0 auto 28px;line-height:1.6}
      a.btn{display:inline-block;background:#fff;color:#09090b;padding:12px 22px;border-radius:999px;
        font-weight:500;text-decoration:none}
      a.btn:hover{background:#e4e4e7}
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn" href="/">Back to home</a>
    </main>
  </body>
</html>
