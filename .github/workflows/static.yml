name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; let a running production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Check SEO files in build output
        run: |
          set -e
          for f in index.html 404.html robots.txt sitemap.xml; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          grep -q "<title>" dist/index.html
          grep -q 'name="description"' dist/index.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'application/ld+json' dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5